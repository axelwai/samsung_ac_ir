name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  encoder:
    name: Encoder vectors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify encoder reproduces the real captures
        run: python3 verify_encoder.py

  esphome-config:
    name: ESPHome config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ESPHome
        run: pip install esphome
      - name: Generate dummy secrets
        run: |
          python3 - <<'PY' > secrets.yaml
          import base64, os
          print('wifi_ssid: "ci"')
          print('wifi_password: "ci_password_1234"')
          print('ota_password: "ci_ota"')
          print(f'api_encryption_key: "{base64.b64encode(bytes(range(32))).decode()}"')
          PY
      - name: Validate example config
        run: esphome config example-samsung-ac.yaml
